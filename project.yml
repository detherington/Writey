name: Writey
options:
  bundleIdPrefix: com.writey
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:

  # ===== macOS =====
  Writey:
    type: application
    platform: macOS
    sources:
      - path: Sources/Writey/Core
        excludes:
          - "**/*.template.swift"
      - path: Sources/Writey/Shared
      - path: Sources/Writey/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.writey.Writey
        PRODUCT_NAME: Writey
        CODE_SIGN_ENTITLEMENTS: Sources/Writey/macOS/Writey.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Writey
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Writey/macOS/Info.plist
      properties:
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Rich Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.rtf
            NSDocumentClass: ""
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
            NSDocumentClass: ""
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
            NSDocumentClass: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.writey.Writey.oauth
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - com.googleusercontent.apps.577786438263-sstr9776vffvfgirv665kr227gmrk1cs

  # ===== iOS (iPad) =====
  Writey-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Writey/Core
        excludes:
          - "**/*.template.swift"
      - path: Sources/Writey/Shared
      - path: Sources/Writey/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.writey.Writey
        PRODUCT_NAME: Writey
        DEVELOPMENT_TEAM: 8B29CDK832       # Paid Apple Developer Program team
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad — universal
        INFOPLIST_KEY_CFBundleDisplayName: Writey
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # "Open in Writey" from the Files app edits the original file in
        # place rather than a copy.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    entitlements:
      path: Sources/Writey/iOS/Writey-iOS.entitlements
      properties:
        # iCloud Drive ▸ Writey — where the document list lives.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.writey.Writey]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.writey.Writey]
        com.apple.developer.icloud-services: [CloudDocuments]
    info:
      path: Sources/Writey/iOS/Info.plist
      properties:
        # Writey only does HTTPS — TLS is exempt from US export
        # encryption regs, so saying so here saves you clicking through
        # the encryption-compliance dialog on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Shows the local Documents folder in Files as On My iPhone ▸ Writey:
        # Sync Backups live there, and so do documents when iCloud Drive is off.
        UIFileSharingEnabled: true
        # Publishes the iCloud container's Documents folder as a "Writey"
        # folder in iCloud Drive, visible in Files and in Finder on the Mac.
        NSUbiquitousContainers:
          iCloud.com.writey.Writey:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Writey
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleDocumentTypes:
          - CFBundleTypeName: Rich Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.rtf
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        CFBundleURLTypes:
          - CFBundleURLName: com.writey.Writey.oauth
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - com.googleusercontent.apps.577786438263-sstr9776vffvfgirv665kr227gmrk1cs
